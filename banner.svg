<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <style>
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes draw {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 26px;
      letter-spacing: 8px;
      animation: pulse 4s ease-in-out infinite;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #8b949e;
      font-size: 11px;
      letter-spacing: 5px;
    }
    .wave {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 12s linear infinite;
    }
    .grid-line {
      stroke: #161b22;
      stroke-width: 0.5;
    }
  </style>

  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="glow-dim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.01" />
      <stop offset="50%" stop-color="#8b949e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="220" fill="#0d1117" rx="6" />

  <!-- Aesthetic Grid -->
  <g>
    <!-- horizontal -->
    <line x1="0" y1="44" x2="800" y2="44" class="grid-line" />
    <line x1="0" y1="88" x2="800" y2="88" class="grid-line" />
    <line x1="0" y1="132" x2="800" y2="132" class="grid-line" />
    <line x1="0" y1="176" x2="800" y2="176" class="grid-line" />
    <!-- vertical -->
    <line x1="160" y1="0" x2="160" y2="220" class="grid-line" />
    <line x1="320" y1="0" x2="320" y2="220" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="220" class="grid-line" />
    <line x1="640" y1="0" x2="640" y2="220" class="grid-line" />
  </g>

  <!-- Animated Waves -->
  <path d="M 0,110 Q 200,60 400,110 T 800,110" fill="none" stroke="url(#glow)" stroke-width="1.5" class="wave" style="animation-duration: 10s;" />
  <path d="M 0,110 Q 200,160 400,110 T 800,110" fill="none" stroke="url(#glow-dim)" stroke-width="1" class="wave" style="animation-duration: 15s; animation-delay: -3s;" />
  <path d="M 0,110 C 200,30 600,190 800,110" fill="none" stroke="url(#glow-dim)" stroke-width="0.75" class="wave" style="animation-duration: 20s; animation-delay: -6s;" />

  <!-- Centered Text -->
  <g style="animation: float 5s ease-in-out infinite;">
    <text x="400" y="105" text-anchor="middle" class="text-title">KAUAN GUIMARÃES</text>
    <text x="400" y="135" text-anchor="middle" class="text-subtitle">FULL-STACK DEVELOPER</text>
  </g>
</svg>
